# Full local stack, one command:   docker compose up -d --build   →   http://localhost:8080
# The one-shot "setup" service migrates the database and seeds the demo tenant on first run.
x-api-env: &api-env
  APP_ENV: production
  APP_KEY: ${APP_KEY:-base64:YmUhd7oFd1aIWbkuDx+MkWMe0oY4FGI7cWW2RZcsiC4=}
  APP_DEBUG: "false"
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_DATABASE: aixbi
  DB_USERNAME: aixbi
  DB_PASSWORD: ${DB_PASSWORD:-aixbi}
  ANALYTICS_DB_HOST: postgres
  ANALYTICS_DB_DATABASE: aixbi
  ANALYTICS_DB_USERNAME: aixbi_reader
  ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-aixbi_reader}
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123}
  AI_SERVICE_URL: http://ai:8100
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-internal-token}
  SEED_DEMO: "true"
  CONNECTORS_ALLOW_HOSTS: ${CONNECTORS_ALLOW_HOSTS:-}
  CONNECTORS_BLOCK_PRIVATE: ${CONNECTORS_BLOCK_PRIVATE:-false}
  LOG_CHANNEL: stderr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: aixbi, POSTGRES_USER: aixbi, POSTGRES_PASSWORD: "${DB_PASSWORD:-aixbi}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aixbi"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  # Runs once per start: migrations always, demo seed only into an empty database.
  setup:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    command: ["php", "artisan", "aixbi:install"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    # Lets connectors reach a database on this computer as host.docker.internal (Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on: { setup: { condition: service_completed_successfully } }
    volumes: [exports:/var/www/storage/app]

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    # Lets connectors reach a database on this computer as host.docker.internal (Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300"]
    restart: unless-stopped
    depends_on: { setup: { condition: service_completed_successfully } }
    volumes: [exports:/var/www/storage/app]

  scheduler:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on: { setup: { condition: service_completed_successfully } }
    volumes: [exports:/var/www/storage/app]

  ai:
    build: { context: ., dockerfile: infra/docker/ai.Dockerfile }
    restart: unless-stopped
    environment:
      AIXBI_API_URL: http://web:8080/api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-internal-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    ports: ["${AIXBI_PORT:-8080}:8080"]
    restart: unless-stopped
    depends_on: [api, ai]

volumes: { pgdata: {}, redisdata: {}, exports: {} }
