name: CI
on:
  push: { branches: ["**"] }
  pull_request:

# Every job runs the same gates a contributor runs locally (see CONTRIBUTING.md):
# format → lint/static analysis → dependency audit → tests.

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: aixbi_test, POSTGRES_USER: aixbi, POSTGRES_PASSWORD: aixbi }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_pgsql, redis, intl, zip, gd", coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - name: Code style (Pint)
        run: composer lint
      - name: Static analysis (Larastan level 6)
        run: composer analyse
      - name: Dependency audit
        run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests (PostgreSQL, scaled demo data)
        env: { DB_USERNAME: aixbi, DB_PASSWORD: aixbi, ANALYTICS_DB_USERNAME: aixbi_reader, ANALYTICS_DB_PASSWORD: aixbi_reader }
        run: php artisan test

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/ai/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Format (ruff)
        run: ruff format --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy --strict)
        run: mypy
      - name: Tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (angular-eslint, incl. template accessibility)
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build (strict templates)
        run: npx ng build --configuration production
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  images:
    needs: [api, ai, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -f infra/docker/api.Dockerfile -t aixbi/api .
          docker build -f infra/docker/ai.Dockerfile -t aixbi/ai .
          docker build -f infra/docker/web.Dockerfile -t aixbi/web .
